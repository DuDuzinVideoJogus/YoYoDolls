<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloneTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="cabecalho">

        <div class="cabecalho-inicio">
            <div class="logotipo">
                <i class="fa-solid fa-bars"></i>
                <i class="fa-brands fa-youtube logotipo-icone"></i>
                <span class="logotipo-nome">CloneTube</span>
                <span class="logotipo-pais">BR</span>
            </div>
        </div>


        <div class="cabecalho-centro">
            <div class="search">
                <input type="text" name="search" id="search-input" class="search-input">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <button class="microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>


        <div class="cabecalho-rodape">
            <button class="botao-video" title="Criar">
                <i class="fa-solid fa-video"></i>
            </button>

            <button class="botao-" title="Notificações">
                <i class="fa-solid fa-bell"></i>
            </button>

            <button class="avatar-usuario" title="Sua conta">V</button>
        </div>

    </header>

    <script src="./script.js"></script>

</body>

</html>
